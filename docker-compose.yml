version: '3.8'

services:
  rosak-alert:
    build: .
    container_name: rosak-alert
    restart: always
    ports:
      - "80:3000"
      - "443:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/data/data.db
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
