name: Deploy RosakAlert System

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy RosakAlert
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Storage Directories
        run: |
          mkdir -p uploads data
          chmod -R 775 uploads data || true

      - name: Build and Restart Docker Containers
        run: |
          DOCKER_CMD="docker compose"
          if ! command -v docker &> /dev/null || ! docker compose version &> /dev/null; then
            if command -v docker-compose &> /dev/null; then
              DOCKER_CMD="docker-compose"
            else
              echo "❌ Neither 'docker compose' nor 'docker-compose' was found on host."
              exit 1
            fi
          fi

          echo "🚀 Rebuilding and deploying with '$DOCKER_CMD'..."
          $DOCKER_CMD down || true
          $DOCKER_CMD build --no-cache
          $DOCKER_CMD up -d
          echo "✅ Container rebuilt and started successfully!"

      - name: Verify Live Domain & Health Check
        run: |
          echo "⏳ Waiting 5s for container to initialize..."
          sleep 5

          echo "🔍 Checking local container on port 80..."
          if curl -f -s -o /dev/null http://127.0.0.1:80; then
            echo "✅ Container is healthy on port 80!"
          else
            echo "⚠️ Warning: Local port 80 check failed. Checking container logs..."
            docker logs --tail 30 rosak-alert || true
          fi

          echo "🔍 Verifying domain https://campusfix.org..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --connect-timeout 10 https://campusfix.org || echo "FAILED")
          echo "HTTP Status for campusfix.org: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" =~ ^(200|301|302|304)$ ]]; then
            echo "🎉 Deployment verified! https://campusfix.org is live and reachable."
          else
            echo "⚠️ Domain check returned $HTTP_STATUS (may take a moment for Cloudflare/DNS cache to refresh)."
          fi


