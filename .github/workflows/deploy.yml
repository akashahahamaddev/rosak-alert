name: Deploy RosakAlert System

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy RosakAlert
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Storage Directories
        run: |
          mkdir -p uploads data

      - name: Build and Restart Docker Containers
        run: |
          if command -v docker &> /dev/null && docker compose version &> /dev/null; then
            echo "🚀 Rebuilding and deploying with 'docker compose'..."
            docker compose down || true
            docker compose build --no-cache
            docker compose up -d
          elif command -v docker-compose &> /dev/null; then
            echo "🚀 Rebuilding and deploying with 'docker-compose'..."
            docker-compose down || true
            docker-compose build --no-cache
            docker-compose up -d
          else
            echo "❌ Neither 'docker compose' nor 'docker-compose' was found on host."
            exit 1
          fi
          echo "✅ Container rebuilt and started successfully!"
